name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - uses: https://git.techwritescode.dev/techwritescode/setup-forgejo@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup cmake
        uses: https://git.techwritescode.dev/techwritescode/setup-cmake@master

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: /opt/ps2dev
          components: toolchain,cmake,ninja,sdk-core

      - name: Configure with CMake
        env:
          PS2DEV: /opt/ps2dev
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/opt/ps2dev/tools/ninja \
            -DCMAKE_INSTALL_PREFIX=/opt/ps2dev/packages/world/ps2stuff

      - name: Build
        run: cmake --build build

      - name: Install
        run: cmake --install build

      # Real, unmodified upstream license text, not generated -
      # cmake --install only copies build outputs, never the repo's
      # own root COPYING - LGPL-2.1 has real distribution obligations,
      # so shipping this without its license text is a genuine
      # compliance problem, not a nicety.
      - name: Bundle license
        run: cp COPYING /opt/ps2dev/packages/world/ps2stuff/COPYING

      # Unsuffixed, matching sdk-core/sdk-world/audsrv - this is
      # cross-compiled PS2 MIPS content, not a host binary.
      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          cd /opt/ps2dev/packages/world/ps2stuff && zip -r "$GITHUB_WORKSPACE/ps2stuff-$version.zip" .

      - name: Publish release
        run: |
          version="${GITHUB_REF_NAME}"
          fj release create "$version" -t "$version" -a "ps2stuff-$version.zip" -r ps2/ps2stuff

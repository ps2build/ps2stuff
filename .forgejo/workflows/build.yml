name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Setup cmake
        uses: https://git.techwritescode.dev/techwritescode/setup-cmake@master

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: /opt/ps2dev
          components: toolchain,cmake,ninja,sdk-core

      # CMAKE_MAKE_PROGRAM is set explicitly rather than relying on
      # ninja being on PATH - this runs in a fresh Docker container
      # each time, so "ps2build update ninja"'s install into
      # $PS2DEV/tools/ninja is never actually on PATH here.
      - name: Configure with CMake
        env:
          PS2DEV: /opt/ps2dev
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/opt/ps2dev/tools/ninja \
            -DCMAKE_INSTALL_PREFIX=/opt/ps2dev/packages/world/ps2stuff

      - name: Build
        run: cmake --build build

      - name: Install
        run: cmake --install build

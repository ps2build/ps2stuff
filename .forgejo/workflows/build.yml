name: Build

on:
  push:
  pull_request:

jobs:
  build:
    # Same real Windows-capable Forgejo runner sdk-core/sdk-world build on
    # - the EE cross-compiler is a native Windows .exe (built via MSYS2).
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      # Checked out purely as a source for ps2dev.cmake, the CMake
      # toolchain file real upstream CMake projects (this one included)
      # build against - not installed by setup-sdk itself. `path: ../x`
      # is rejected by this runner's own action sandboxing ("Repository
      # path ... is not under ... hostexecutor" - a real, separately
      # confirmed bug, not specific to this repo), so this nests inside
      # the checkout instead of landing as a true sibling - fine here,
      # since every reference to it below is fully contained within
      # this same workflow file (unlike sdk-world's own sdk-core
      # checkout, whose hardcoded ps2.yaml-level ../../sdk-core paths
      # need a true sibling and get theirs via a Move-Item step).
      - name: Checkout cmake-toolchain (source, for ps2dev.cmake)
        uses: actions/checkout@v4
        with:
          repository: ps2/cmake-toolchain
          path: cmake-toolchain

      # C:\ps2dev-consumer, not C:\ps2dev - sdk-core/sdk-world's own CI
      # builds the SDK from source into C:\ps2dev on this same
      # self-hosted runner; a real external CMake consumer (this repo)
      # needs its own separate, already-built SDK install so concurrent
      # runs of both kinds of workflow can never step on each other's
      # in-progress C:\ps2dev.
      - name: Clean C:\ps2dev-consumer
        shell: pwsh
        run: Remove-Item -Recurse -Force C:\ps2dev-consumer -ErrorAction SilentlyContinue

      - uses: https://git.techwritescode.dev/ps2/setup-sdk@master
        with:
          ps2dev: C:\ps2dev-consumer

      - name: Configure with CMake
        shell: pwsh
        run: |
          $env:PS2DEV = "C:\ps2dev-consumer"
          cmake -S . -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE=cmake-toolchain/ps2dev.cmake `
            -DCMAKE_INSTALL_PREFIX=C:\ps2dev-consumer\packages\world\ps2stuff

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Install
        shell: pwsh
        run: cmake --install build

      - name: Get short SHA
        id: slug
        shell: pwsh
        run: "'sha8=' + $env:GITHUB_SHA.Substring(0,8) >> $env:GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: libps2stuff-${{ steps.slug.outputs.sha8 }}
          path: build/*.a

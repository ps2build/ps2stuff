name: ps2stuff
origin: port:ps2stuff
tier: world
license: LGPL-2.1-only

# world: a C++ convenience layer over the GS/DMA/VIF (packets, sprites,
# textures, matrices) - vendored from https://github.com/ps2dev/ps2stuff,
# built via its own real CMakeLists.txt (see cmake-toolchain/ps2dev.cmake
# and this repo's own .forgejo/workflows) rather than a hand-translated
# ps2build ps2.yaml, so this package.yaml is hand-authored to describe
# CMake's own install() output, not generated by "ps2build install".
#
# headers: only what's actually exercised by the real, verified build
# (dma, libgs) - a handful of this repo's own public headers
# (eeregs.h/eestruct.h/eetypes.h/libgraph.h) reference pre-migration
# ps2sdk filenames that don't exist under those names in sdk-core
# anymore (ee_regs.h, graph.h - real renames from the core/ migration).
# Live code paths never hit them (NO_VU0_VECTORS/NO_ASM disable the
# sections that would), confirmed by this package's own CI actually
# compiling clean - but a consumer that enables those code paths would
# hit a real, currently-unresolved gap. Flagged in FEEDBACK.md, not
# fixed here (out of scope for packaging what already builds).
artifacts:
  - kind: library
    target: [ee]
    include_dirs: [include]
    headers: [dma, libgs]
    lib: lib/libps2stuff.a
